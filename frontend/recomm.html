<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TravelWise Recommendations</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="route.css">

    <style>

        body {

            margin: 0;
            padding: 0;

            background:
                linear-gradient(
                    135deg,
                    #0f172a,
                    #1e293b
                );

            font-family: Arial, sans-serif;

            color: white;
        }

        .recommend-wrap {

            width: 90%;
            max-width: 1200px;

            margin: auto;

            padding: 40px 0;
        }

        .recommend-header {

            text-align: center;

            margin-bottom: 40px;
        }

        .recommend-header h1 {

            font-size: 42px;

            margin-bottom: 10px;
        }

        .recommend-header p {

            color: #cbd5e1;
        }

        .card-glass {

            background: rgba(255,255,255,0.08);

            backdrop-filter: blur(10px);

            border-radius: 20px;

            padding: 30px;

            border: 1px solid rgba(255,255,255,0.1);
        }

        .form-row {

            display: flex;

            gap: 20px;

            flex-wrap: wrap;
        }

        .form-group {

            flex: 1;

            display: flex;

            flex-direction: column;
        }

        .form-group label {

            margin-bottom: 8px;

            font-weight: bold;
        }

        .form-group input,
        .form-group select {

            padding: 12px;

            border-radius: 10px;

            border: none;

            font-size: 15px;
        }

        button {

            margin-top: 25px;

            padding: 14px 25px;

            border: none;

            border-radius: 12px;

            background: #3b82f6;

            color: white;

            font-size: 16px;

            cursor: pointer;

            transition: 0.3s;
        }

        button:hover {

            background: #2563eb;
        }

        .route-stats {

            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(200px, 1fr));

            gap: 20px;

            margin-top: 35px;
        }

        .stat-box {

            background: rgba(255,255,255,0.08);

            padding: 20px;

            border-radius: 15px;

            text-align: center;
        }

        .stat-val {

            font-size: 26px;

            font-weight: bold;

            display: block;

            margin-bottom: 8px;
        }

        .recommend-grid {

            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(260px, 1fr));

            gap: 25px;

            margin-top: 35px;
        }

        .recommend-card {

            background: rgba(255,255,255,0.08);

            border-radius: 18px;

            padding: 20px;

            border: 1px solid rgba(255,255,255,0.1);

            transition: 0.3s;
        }

        .recommend-card:hover {

            transform: translateY(-5px);
        }

        .recommend-card h3 {

            margin-top: 0;
        }

        .rec-tags {

            display: flex;

            gap: 10px;

            flex-wrap: wrap;

            margin: 15px 0;
        }

        .rec-tags span {

            background: rgba(255,255,255,0.08);

            padding: 6px 10px;

            border-radius: 10px;

            font-size: 14px;
        }

        .free-badge {

            margin-top: 15px;

            background: #16a34a;

            display: inline-block;

            padding: 6px 12px;

            border-radius: 10px;

            font-weight: bold;
        }

        .insight-box {

            background: rgba(255,255,255,0.08);

            padding: 20px;

            border-radius: 16px;

            margin-top: 30px;

            font-size: 15px;
        }

        .hidden {
            display: none;
        }

        .error-box {

            margin-top: 20px;

            background: rgba(255,0,0,0.2);

            padding: 15px;

            border-radius: 10px;

            color: #fecaca;
        }

    </style>

</head>

<body>

<div class="recommend-wrap">

    <header class="recommend-header">

        <h1>🎯 Travel Recommendation Engine</h1>

        <p>
            Smart activity suggestions based on
            budget, rating, popularity & safety.
        </p>

    </header>

    <section class="card-glass">

        <div class="form-row">

            <div class="form-group">

                <label>Activity Type</label>

                <select id="activity-type">

                    <option value="Adventure">Adventure</option>

                    <option value="Spiritual">Spiritual</option>

                    <option value="Nature">Nature</option>

                    <option value="Food">Food</option>

                </select>

            </div>

            <div class="form-group">

                <label>Budget (₹)</label>

                <input
                    type="number"
                    id="activity-budget"
                    placeholder="Enter budget"
                >

            </div>

        </div>

        <div class="form-group" style="margin-top:20px;">

            <label>Minimum Rating</label>

            <input
                type="number"
                id="min-rating"
                min="0"
                max="5"
                step="0.1"
                placeholder="e.g. 4"
            >

        </div>

        <button onclick="getRecommendations()">
            Get Recommendations 
        </button>

        <div id="error-box" class="error-box hidden"></div>

    </section>

    <!-- RESULT SECTION -->

    <section id="recommend-section" class="hidden">

        <div class="route-stats">

            <div class="stat-box">

                <span id="rec-budget" class="stat-val"></span>

                <span>Total Budget</span>

            </div>

            <div class="stat-box">

                <span id="rec-spent" class="stat-val"></span>

                <span>Spent</span>

            </div>

            <div class="stat-box">

                <span id="rec-remaining" class="stat-val"></span>

                <span>Remaining</span>

            </div>

        </div>

        <div id="recommend-cards" class="recommend-grid"></div>

    </section>

</div>

<script>

const API = "http://127.0.0.1:5000";

async function getRecommendations() {

    const type = document.getElementById("activity-type").value;

    const budget = parseInt(
        document.getElementById("activity-budget").value
    );

    const min_rating = parseFloat(
        document.getElementById("min-rating").value || 0
    );

    if (!budget || budget <= 0) {

        return showError(
            "Please enter valid budget."
        );
    }

    hideError();

    try {

        const response = await fetch(`${API}/recommend`, {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                type,
                budget,
                min_rating
            })
        });

        const json = await response.json();

        if (json.status !== "success") {
            throw new Error(json.message);
        }

        renderRecommendations(json.data);

    } catch (e) {

        showError(
            "Recommendation Error: " + e.message
        );
    }
}


function renderRecommendations(data) {

    document.getElementById("rec-budget").textContent =
        "₹" + data.budget.total;

    document.getElementById("rec-spent").textContent =
        "₹" + data.budget.spent;

    document.getElementById("rec-remaining").textContent =
        "₹" + data.budget.remaining;

    const cards = data.activities.map(a => {

        return `

            <div class="recommend-card">

                <h3>${a.name}</h3>

                <div class="rec-tags">

                    <span>⭐ ${a.rating}</span>

                    <span>🛡️ ${a.safety}</span>

                    <span>🔥 ${a.popularity}</span>

                </div>

                <p><strong>Type:</strong> ${a.type}</p>

                <p><strong>Cost:</strong> ₹${a.cost}</p>

                <p>
                    <strong>Recommendation Score:</strong>
                    ${a.recommendation_score}
                </p>

                ${
                    a.free
                    ? `<div class="free-badge">FREE</div>`
                    : ""
                }

            </div>
        `;
    }).join("");

    document.getElementById("recommend-cards").innerHTML = `

        <div class="insight-box">
            ${data.insight}
        </div>

        ${cards}
    `;

    document
        .getElementById("recommend-section")
        .classList
        .remove("hidden");
}


function showError(msg) {

    const el = document.getElementById("error-box");

    el.textContent = msg;

    el.classList.remove("hidden");
}

function hideError() {

    document
        .getElementById("error-box")
        .classList
        .add("hidden");
}

</script>

</body>
</html>
